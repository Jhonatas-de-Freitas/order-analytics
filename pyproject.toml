[project]
name = "order-analytics"
version = "0.1.0"
description = "Metrics service that builds a read model from the order events on Kafka"
license = "MIT"
authors = [{ name = "Jhonatas de Freitas" }]
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.14",
    "alembic>=1.20",
    "asyncpg>=0.32",
    "fastapi>=0.143",
    "pydantic>=2.14",
    "pydantic-settings>=2.15",
    "sqlalchemy[asyncio]>=2.1",
    "uvicorn>=0.54",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
    "testcontainers>=4.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/order_analytics"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PT", "RUF", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# aiokafka ships without type information.
module = ["aiokafka.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
